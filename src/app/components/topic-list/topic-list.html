@if (topicService.decryptedTopics() === null) { 
    Loading... 
}
@else  { 

<mat-nav-list>
    @for (topic of topicService.decryptedTopics(); track topic.id) {
        <a
          mat-list-item

          [routerLink]="['/topic', topic.id  ]"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive" 
        >

            <div 
              class="d-flex flex-row justify-content-start align-items-center"
              title="{{topic.id}}"
            >
                <svg 
                   data-jdenticon-value="{{topic.id}}" 
                   width="30" 
                   height="30"
                   role="img"
                   aria-labelledby="{{topic.id}}"
                >
                   {{topic.id}}
                </svg>
                <div class="ps-2">
                {{topic.decryptedData?.title }} 
                </div>
            </div>
        </a>
    }
</mat-nav-list>
}
