<div class="d-none">
    <!-- hidden element for thumbnail generation -->
    <canvas #canvasContainer></canvas>
</div>
<div class="qc-image-dialog-box">
  <h2 mat-dialog-title>Add Image</h2>
  <mat-dialog-content class="w-100 py-5">
    <!--
    <mat-form-field class="w-100">

      <mat-label>Favorite Animal</mat-label>
    -->

      <input
         hidden=true
         type="file"
         class="file-input"
         (change)="onFileSelected($event)"
         (cancel)="onFileSelectCancel($event)"
         #fileUpload>
      @if ( imageData() ) {
        <div class="d-flex flex-row justify-content-center">
            <img [src]="thumbData()" alt="Image" />
        </div>
        <div class="d-flex flex-row justify-content-center">
            {{ imageName() }}
        </div>
        <div class="d-flex flex-row justify-content-center">
            {{ imageSize() | bytesDisplay }}
        </div>
        <div class="d-flex flex-row justify-content-center py-2">
           <mat-form-field class="caption-form">
             <mat-label>Caption</mat-label>
             <input matInput [(ngModel)]="imageCaption" />
           </mat-form-field>
        </div>
        <div class="d-flex flex-row justify-content-end">
          <div class="ms-2">
             <button mat-mini-fab
               class="delete-button"
               (click)="onClearImage()"
             >
                 <mat-icon>delete</mat-icon>
             </button>
          </div>

        </div>
      }
      @else {
        <div class="file-upload d-flex flex-row justify-content-end">

          <div class="d-flex flex-column justify-content-center">
              <div>
              @if (loadingImage()) {
                Loading....
              }
              @else if (imageError()) {
                {{ imageError() }}
              }
              @else {
                "No file uploaded yet
              }
             </div>
          </div>
          <div class="ms-2">
             <button mat-mini-fab
               matSuffix
               color="primary"
               class="upload-btn"
               (click)="onClick(fileUpload)"
               cdkFocusInitial
             >
                 <mat-icon>attach_file</mat-icon>
             </button>
          </div>
        </div>
      }
    <!--
    </mat-form-field>
     -->
  </mat-dialog-content>
  <mat-dialog-actions>
    <mat-button-toggle-group [disabled]="loadingImage()">
      <button matButton (click)="onNoClick()">Cancel</button>
        <button
           matButton
           [mat-dialog-close]="returnData()"
           [disabled]="disableSendButton()"
        >
        Send
        </button>
    </mat-button-toggle-group>
  </mat-dialog-actions>
</div>
