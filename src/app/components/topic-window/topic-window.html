<div class="row flex-fill  px-3 mx-0 h-100">
  <div class="col-12  justify-content-start align-items-top px-0">
    @if (topic() === null) {
        Loading...
    }
    @else  {

       <div class="row h-100 d-flex justify-content-start align-items-top mx-0">
         <div class="col-12 d-flex flex-column  px-0">

            <div class="row mx-0 justify-content-center">
               <div class="col-12 col-xl-10 py-4 px-0">
                  <h1  class="text-center my-0">{{ topic()?.decryptedData?.title }}</h1>
                  <div class="d-flex flex-row justify-content-center">
                  <p class="my-0 pt-4 fs-5">{{ topic()?.decryptedData?.description }}</p>
                  </div>
               </div>
            </div>
            <div class="row mx-0 pb-3 justify-content-center w-100">
                <div class="col-10 d-flex flex-column align-items-center px-0" >
                    <div class="d-flex flex-row justify-content-center w-100" >
                        <div class="d-flex flex-column justify-content-center pe-2">
                            <h3 class="my-0">Reply URL</h3>
                        </div>
                        <div class="d-flex flex-column justify-content-center w-75 reply-link">
                            <input
                              #codeInput
                              type="text"
                              value="{{ replyUrl() }}"
                              disabled
                            />
                        </div>
                        <div class="d-flex flex-column justify-content-center">
                           <button mat-icon-button
                              matTooltip="Copy Request URL"
                              matTooltipClass="button-tooltip"
                              matTooltipPosition="above"
                              (click)="copyText()"
                              aria-label="Copy">
                              <mat-icon>content_copy</mat-icon>
                           </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row flex-grow-1 mx-0 my-0 mt-4 w-100">
               <div class="col-12 d-flex flex-column px-0 pb-5 reply-list-container">

             <!--
               <div class="col-12 col-lg-10 d-flex flex-column px-0">

              -->

                   <!--
                   @if ( decryptedReplies() !== null) {
                    -->
                   <app-topic-reply-list
                       [(decryptedReplies)]="decryptedReplies"
                       [loadingReplies]="loadingReplies()"
                       [commentAction]="true"
                       (endOfScrollOut)="handleEndOfScroll($event)"
                    >
                    </app-topic-reply-list>
                    <!--
                   }
                     -->
               </div>
            </div>
         </div>
       </div>


    }
  </div>
</div>
