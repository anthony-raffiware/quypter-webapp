user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    #gzip  on;

    upstream qc_backend {
        server qc_api:8000;
        keepalive 8;
        keepalive_timeout 1s;
    }

    server {
        listen 80;

        server_name _;

        location / {

            return 301 https://$host:8443$request_uri;
        }

    }

    server {
        listen       443 ssl;
        server_name  _;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        root   /usr/share/nginx/html/browser;

        error_page 500 502 504 =500 @qc_50*_json;
        error_page 503 @qc_503_json;

        location @qc_503_json {
            default_type application/json;
            return 503 '{"data":"Service Unavailable","meta":{"error":true,"request_id":"0000000000000000","data_type":"Error"}}';
        }

        location @qc_50*_json {
            default_type application/json;
            return 500 '{"data":"Upstream Error","meta":{"error":true,"request_id":"0000000000000000","data_type":"Error"}}';
        }

        location / {

            try_files $uri $uri/ /index.html;
        }

        location /api {

            proxy_http_version 1.1;
            proxy_pass_request_headers  on;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Base   "http://localhost";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_intercept_errors off;
            proxy_redirect off;

            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;

            proxy_pass http://qc_backend;
        }

    }

}


